<div class="dashboard-wrapper">

  <!-- Backdrop for mobile drawer -->
  <div class="sidebar-backdrop" *ngIf="isSidebarMobileOpen" (click)="toggleMobileSidebar()">
  </div>

  <!-- Sidebar Navigation (Constant across all child routes) -->
  <aside class="dashboard-sidebar" [class.mobile-open]="isSidebarMobileOpen">

    <!-- Sidebar Header -->
    <div class="sidebar-header">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24">
          <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z" />
        </svg>
      </div>
      <div class="brand-info">
        <h3 class="brand-title">EduManager</h3>
        <span class="brand-subtitle">School Portal</span>
      </div>
      <button type="button" class="close-sidebar-btn" (click)="toggleMobileSidebar()">
        <svg viewBox="0 0 24 24">
          <path
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
        </svg>
      </button>
    </div>

    <!-- Navigation Menu Groups -->
    <nav class="sidebar-menu">
      <ng-container *ngFor="let group of menuGroups">
        <div class="menu-group" *ngIf="hasRolePermission(group.roles)">

          <!-- Group Header (If Collapsible or Label Exists) -->
          <div *ngIf="group.label" class="group-header" [class.collapsible]="group.collapsible"
            (click)="group.collapsible ? toggleGroup(group.groupId) : null">

            <div class="group-header-left">
              <span class="group-title">{{ group.label }}</span>
            </div>

            <div class="group-header-right" *ngIf="group.collapsible">
              <svg class="chevron-icon" [class.rotated]="isGroupCollapsed(group.groupId)" viewBox="0 0 24 24">
                <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z" />
              </svg>
            </div>
          </div>

          <!-- Menu Items List -->
          <ul class="menu-items-list" [class.hidden]="group.collapsible && isGroupCollapsed(group.groupId)">
            <ng-container *ngFor="let item of group.items">
              <li *ngIf="hasRolePermission(item.roles)">
                <a [routerLink]="item.route" routerLinkActive="active"
                  [routerLinkActiveOptions]="{exact: item.route === '/admin/dashboard' || item.route === '/dashboard'}"
                  class="menu-link">

                  <!-- Dynamic SVG Icons -->
                  <span class="menu-icon">
                    <svg *ngIf="item.icon === 'home'" viewBox="0 0 24 24">
                      <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
                    </svg>
                    <svg *ngIf="item.icon === 'users'" viewBox="0 0 24 24">
                      <path
                        d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" />
                    </svg>
                    <svg *ngIf="item.icon === 'shield'" viewBox="0 0 24 24">
                      <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" />
                    </svg>
                    <svg *ngIf="item.icon === 'sitemap'" viewBox="0 0 24 24">
                      <path d="M22 11V3h-7v3H9V3H2v8h7V8h2v10h4v3h7v-8h-7v3h-2V8h2v3h7z" />
                    </svg>
                    <svg *ngIf="item.icon === 'box'" viewBox="0 0 24 24">
                      <path
                        d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z" />
                    </svg>
                    <svg *ngIf="item.icon === 'bookmark'" viewBox="0 0 24 24">
                      <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z" />
                    </svg>
                    <svg *ngIf="item.icon === 'book-open'" viewBox="0 0 24 24">
                      <path
                        d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.1 20.45 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.25-.75-2-1zm0 13.5c-1.1-.35-2.3-.5-3.5-.5-1.7 0-4.15.65-5.5 1.5V8c1.35-.85 3.8-1.5 5.5-1.5 1.2 0 2.4.15 3.5.5v11.5z" />
                    </svg>
                    <svg *ngIf="item.icon === 'calendar'" viewBox="0 0 24 24">
                      <path
                        d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z" />
                    </svg>
                    <svg *ngIf="item.icon === 'clipboard-list'" viewBox="0 0 24 24">
                      <path
                        d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z" />
                    </svg>
                    <svg *ngIf="item.icon === 'user-check'" viewBox="0 0 24 24">
                      <path
                        d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm9.3-5.3l-1.4-1.4-3.9 3.9-1.9-1.9-1.4 1.4 3.3 3.3z" />
                    </svg>
                    <svg *ngIf="item.icon === 'currency-dollar'" viewBox="0 0 24 24">
                      <path
                        d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z" />
                    </svg>
                    <svg *ngIf="item.icon === 'user-add'" viewBox="0 0 24 24">
                      <path
                        d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4zm-9-2V9H4v3H1v2h3v3h2v-3h3v-2H6z" />
                    </svg>
                  </span>

                  <span class="menu-text">{{ item.label }}</span>
                </a>
              </li>
            </ng-container>
          </ul>

        </div>
      </ng-container>
    </nav>

    <!-- Sidebar User Profile Footer -->
    <div class="sidebar-user-footer">
      <div class="user-avatar">
        <span>{{ (currentUser?.Name || 'A')[0] }}</span>
      </div>
      <div class="user-details">
        <span class="user-name">{{ currentUser?.Name || 'Super Admin' }}</span>
        <span class="user-role-badge">{{ userRole }}</span>
      </div>
      <button type="button" class="logout-mini-btn" (click)="onLogout()" title="Sign Out">
        <svg viewBox="0 0 24 24">
          <path
            d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z" />
        </svg>
      </button>
    </div>

  </aside>

  <!-- Main Content Body (Constant Top Navbar & Dynamic Router Outlet) -->
  <div class="dashboard-main-content">

    <!-- Top Header Navbar (Constant) -->
    <header class="top-navbar">
      <div class="navbar-left">
        <button type="button" class="mobile-toggle-btn" (click)="toggleMobileSidebar()">
          <svg viewBox="0 0 24 24">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24">
            <path
              d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 11.99 14 9.5 14z" />
          </svg>
          <input type="text" placeholder="Search students, teachers, classes..." />
        </div>
      </div>

      <div class="navbar-right">
        <div class="notif-btn" title="Notifications">
          <svg viewBox="0 0 24 24">
            <path
              d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z" />
          </svg>
          <span class="notif-badge">3</span>
        </div>

        <div class="header-user-profile">
          <div class="user-avatar-sm">
            <span>{{ (currentUser?.Name || 'A')[0] }}</span>
          </div>
          <div class="user-meta">
            <span class="meta-name">{{ currentUser?.Name || 'Super Admin' }}</span>
            <span class="meta-role">{{ userRole }}</span>
          </div>
          <button type="button" class="btn-logout-header" (click)="onLogout()">
            Sign Out
          </button>
        </div>
      </div>
    </header>

    <!-- Dynamic Main Section (Renders Child Routes) -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
