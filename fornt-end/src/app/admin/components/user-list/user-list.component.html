<div class="user-management-container">

  <!-- PrimeNG Confirm Dialog -->
  <p-confirmDialog header="Confirm Action" icon="pi pi-exclamation-triangle"></p-confirmDialog>

  <!-- Page Header Bar -->
  <div class="page-header">
    <div class="header-info">
      <div class="header-icon">
        <i class="pi pi-users"></i>
      </div>
      <div>
        <h2 class="header-title">User Management</h2>
        <p class="header-subtitle">Manage users, contact details, and assigned roles</p>
      </div>
    </div>

    <!-- Top Add User Button -->
    <button pButton type="button" label="Add User" icon="pi pi-user-plus" class="p-button-indigo btn-add-user"
      (click)="onAddUser()">
    </button>
  </div>

  <!-- Main User Table Card -->
  <div class="card p-card-custom">
    <p-table #dt [value]="users" dataKey="Id" [rows]="10" [rowsPerPageOptions]="[10, 25, 50, 100]" [paginator]="true"
      [loading]="isLoading" [globalFilterFields]="['Name', 'Email', 'Phone', 'Role.Name']"
      styleClass="p-datatable-striped custom-user-table">

      <!-- CAPTION: Search & Global Filter -->
      <ng-template pTemplate="caption">
        <div class="caption-flex">
          <div class="search-input-box">
            <span class="p-input-icon-left w-full">
              <i class="pi pi-search"></i>
              <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                placeholder="Search by name, email, phone..." class="w-full" />
            </span>
          </div>

        </div>
      </ng-template>

      <!-- TABLE HEADER -->
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="Name">Name <p-sortIcon field="Name"></p-sortIcon></th>
          <th pSortableColumn="Email">Email <p-sortIcon field="Email"></p-sortIcon></th>
          <th pSortableColumn="Phone">Phone <p-sortIcon field="Phone"></p-sortIcon></th>
          <th pSortableColumn="Role.Name">Role <p-sortIcon field="Role.Name"></p-sortIcon></th>
          <th class="text-right">Action</th>
        </tr>
      </ng-template>

      <!-- TABLE BODY -->
      <ng-template pTemplate="body" let-user>
        <tr>
          <td>
            <div class="user-name-cell">
              <div class="user-avatar">
                {{ (user?.Name || 'U')[0] | uppercase }}
              </div>
              <div class="user-details-col">
                <span class="user-name-text">{{ user?.Name }}</span>
              </div>
            </div>
          </td>
          <td>
            <span class="text-sub"><i class="pi pi-envelope icon-sub"></i> {{ user?.Email }}</span>
          </td>
          <td>
            <span class="text-sub"><i class="pi pi-phone icon-sub"></i> {{ user?.Phone || 'N/A' }}</span>
          </td>
          <td>
            <p-tag [value]="user?.Role?.Name || 'User'" [severity]="getRoleSeverity(user?.Role?.Name)"></p-tag>
          </td>
          <td class="text-right">
            <button pButton type="button" icon="pi pi-pencil" title="Edit User"
              class="p-button-success p-button-outlined p-button-sm action-btn m-1" (click)="onEditUser(user.Id)">
            </button>
            <button pButton type="button" icon="pi pi-trash" title="Delete User"
              class="p-button-danger p-button-outlined p-button-sm action-btn m-1" (click)="onDeleteUser(user.Id)">
            </button>
          </td>
        </tr>
      </ng-template>

      <!-- EMPTY STATE -->
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="5" class="empty-state">
            <div class="empty-box">
              <i class="pi pi-folder-open"></i>
              <p>No user records found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
