<div class="user-modal-wrapper">

  <!-- Header Banner -->
  <div class="modal-banner">
    <div class="banner-avatar">
      <i class="pi" [ngClass]="isEdit ? 'pi-user-edit' : 'pi-user-plus'"></i>
    </div>
    <div class="banner-content">
      <h3 class="banner-title">{{ isEdit ? 'Edit Subject Details' : 'Add New Subject' }}</h3>
      <p class="banner-subtitle">
        {{ isEdit ? 'Modify subject details, department codes, or assign the instructor and class.' : 'Fill in subject
        details to enroll a new curriculum module.' }}
      </p>
    </div>
  </div>

  <form (ngSubmit)="onSubmit()" class="form-container">

    <!-- Alert Banner for Error -->
    <div class="alert alert-danger" *ngIf="errorMessage">
      <i class="pi pi-exclamation-circle alert-icon"></i>
      <div class="alert-text">
        <strong class="alert-title">Unable to Save</strong>
        <span>{{ errorMessage }}</span>
      </div>
    </div>

    <!-- Alert Banner for Success -->
    <div class="alert alert-success" *ngIf="successMessage">
      <i class="pi pi-check-circle alert-icon"></i>
      <div class="alert-text">
        <strong class="alert-title">Success!</strong>
        <span>{{ successMessage }}</span>
      </div>
    </div>

    <div class="form-grid">


      <!-- Department -->
      <div class="form-group col-12">
        <label for="subjectDept" class="form-label">Department</label>
        <div class="input-with-icon">
          <i class="pi pi-sitemap input-icon"></i>
          <p-select id="subjectDept" [options]="departmentOptions" [(ngModel)]="formData.DepartmentId"
            name="DepartmentId" optionLabel="label" optionValue="value" placeholder="Select Department"
            [showClear]="true" styleClass="w-full custom-dropdown">
          </p-select>
        </div>
      </div>

      <!-- Subject Name -->
      <div class="form-group col-6">
        <label for="subjectName" class="form-label">
          Subject Name <span class="required-star">*</span>
        </label>
        <div class="input-with-icon">
          <i class="pi pi-book input-icon"></i>
          <input id="subjectName" type="text" pInputText [(ngModel)]="formData.Name" name="Name"
            placeholder="e.g. Physics" class="w-full custom-input" required />
        </div>
      </div>

      <!-- Subject Code -->
      <div class="form-group col-6">
        <label for="subjectCode" class="form-label">
          Subject Code <span class="required-star">*</span>
        </label>
        <div class="input-with-icon">
          <i class="pi pi-id-card input-icon"></i>
          <input id="subjectCode" type="text" pInputText [(ngModel)]="formData.Code" name="Code"
            placeholder="e.g. PHY-101" class="w-full custom-input" required />
        </div>
      </div>



    </div>

    <!-- Dialog Actions Footer -->
    <div class="form-actions">
      <button type="button" pButton label="Cancel" icon="pi pi-times"
        class="p-button-text p-button-secondary btn-cancel" (click)="onCancel()">
      </button>
      <button type="submit" pButton [label]="isEdit ? 'Save Changes' : 'Create Subject'"
        [icon]="isEdit ? 'pi pi-check-circle' : 'pi pi-plus-circle'" [loading]="isLoading"
        class="p-button-indigo btn-submit">
      </button>
    </div>

  </form>
</div>
