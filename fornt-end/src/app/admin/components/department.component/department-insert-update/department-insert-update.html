<div class="user-modal-wrapper">

  <!-- Header Banner -->
  <div class="modal-banner">
    <div class="banner-avatar">
      <i class="pi" [ngClass]="isEdit ? 'pi-user-edit' : 'pi-user-plus'"></i>
    </div>
    <div class="banner-content">
      <h3 class="banner-title">{{ isEdit ? 'Edit Department Profile' : 'Create New Department' }}</h3>
      <p class="banner-subtitle">
        {{ isEdit ? 'Modify department names, codes, descriptions, and assign the head teacher.' : 'Fill in department details to define a new stream or subject area.' }}
      </p>
    </div>
  </div>

  <form (ngSubmit)="onSubmit()" class="form-container">

    <!-- Alert Banner for Error -->
    <div class="alert alert-danger" *ngIf="errorMessage">
      <i class="pi pi-exclamation-circle alert-icon"></i>
      <div class="alert-text">
        <strong class="alert-title">Unable to Save</strong>
        <span>{{ errorMessage }}</span>
      </div>
    </div>

    <!-- Alert Banner for Success -->
    <div class="alert alert-success" *ngIf="successMessage">
      <i class="pi pi-check-circle alert-icon"></i>
      <div class="alert-text">
        <strong class="alert-title">Success!</strong>
        <span>{{ successMessage }}</span>
      </div>
    </div>

    <div class="form-grid">

      <!-- Department Name -->
      <div class="form-group col-6">
        <label for="deptName" class="form-label">
          Department Name <span class="required-star">*</span>
        </label>
        <div class="input-with-icon">
          <i class="pi pi-sitemap input-icon"></i>
          <input id="deptName" type="text" pInputText [(ngModel)]="formData.Name" name="Name"
            placeholder="e.g. Science" class="w-full custom-input" required />
        </div>
      </div>

      <!-- Department Code -->
      <div class="form-group col-6">
        <label for="deptCode" class="form-label">
          Department Code <span class="required-star">*</span>
        </label>
        <div class="input-with-icon">
          <i class="pi pi-id-card input-icon"></i>
          <input id="deptCode" type="text" pInputText [(ngModel)]="formData.Code" name="Code"
            placeholder="e.g. SCI" class="w-full custom-input" required />
        </div>
      </div>

      <!-- Head Teacher -->
      <div class="form-group col-12">
        <label for="headTeacher" class="form-label">Head of Department (HoD)</label>
        <div class="input-with-icon">
          <i class="pi pi-user input-icon"></i>
          <p-select id="headTeacher" [options]="teacherOptions" [(ngModel)]="formData.HeadId" name="HeadId"
            optionLabel="label" optionValue="value" placeholder="Select Head Teacher" [showClear]="true"
            styleClass="w-full custom-dropdown">
          </p-select>
        </div>
      </div>

      <!-- Description -->
      <div class="form-group col-12">
        <label for="deptDesc" class="form-label">Description</label>
        <div class="input-with-icon">
          <i class="pi pi-align-left input-icon"></i>
          <input id="deptDesc" type="text" pInputText [(ngModel)]="formData.Description" name="Description"
            placeholder="Brief details about the department" class="w-full custom-input" />
        </div>
      </div>

    </div>

    <!-- Dialog Actions Footer -->
    <div class="form-actions">
      <button type="button" pButton label="Cancel" icon="pi pi-times"
        class="p-button-text p-button-secondary btn-cancel" (click)="onCancel()">
      </button>
      <button type="submit" pButton [label]="isEdit ? 'Save Changes' : 'Create Department'"
        [icon]="isEdit ? 'pi pi-check-circle' : 'pi pi-plus-circle'" [loading]="isLoading"
        class="p-button-indigo btn-submit">
      </button>
    </div>

  </form>
</div>
