<div class="user-management-container">

  <!-- PrimeNG Confirm Dialog -->
  <p-confirmDialog header="Confirm Action" icon="pi pi-exclamation-triangle"></p-confirmDialog>

  <!-- Page Header Bar -->
  <div class="page-header">
    <div class="header-info">
      <div class="header-icon">
        <i class="pi pi-shield"></i>
      </div>
      <div>
        <h2 class="header-title">Role Management</h2>
        <p class="header-subtitle">Define system roles, access levels, and permission boundaries</p>
      </div>
    </div>

    <!-- Top Add Role Button -->
    <button pButton type="button" label="Add Role" icon="pi pi-plus-circle" class="p-button-indigo btn-add-user"
      (click)="onAddRole()">
    </button>
  </div>

  <!-- Main Role Table Card -->
  <div class="card p-card-custom">
    <p-table #dt [value]="roles" dataKey="Id" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [paginator]="true"
      [loading]="isLoading" [globalFilterFields]="['Name', 'Description']"
      styleClass="p-datatable-striped custom-user-table">

      <!-- CAPTION: Search & Global Filter -->
      <ng-template pTemplate="caption">
        <div class="caption-flex">
          <div class="search-input-box">
            <span class="p-input-icon-left w-full">
              <i class="pi pi-search"></i>
              <input pInputText type="text" (input)="dt.filterGlobal($any($event.target).value, 'contains')"
                placeholder="Search by role name, description..." class="w-full" />
            </span>
          </div>
        </div>
      </ng-template>

      <!-- TABLE HEADER -->
      <ng-template pTemplate="header">
        <tr>
          <th pSortableColumn="Name">Role Name <p-sortIcon field="Name"></p-sortIcon></th>
          <th pSortableColumn="Description">Description <p-sortIcon field="Description"></p-sortIcon></th>
          <th class="text-right">Action</th>
        </tr>
      </ng-template>

      <!-- TABLE BODY -->
      <ng-template pTemplate="body" let-role>
        <tr>
          <td>
            <div class="user-name-cell">
              <p-tag [value]="role?.Name" [severity]="getRoleSeverity(role?.Name)"></p-tag>
            </div>
          </td>
          <td>
            <span class="text-sub">{{ role?.Description || 'No description provided' }}</span>
          </td>
          <td class="text-right">
            <button pButton type="button" icon="pi pi-pencil" title="Edit Role"
              class="p-button-success p-button-outlined p-button-sm action-btn m-1" (click)="onEditRole(role)">
            </button>
            <button pButton type="button" icon="pi pi-trash" title="Delete Role"
              class="p-button-danger p-button-outlined p-button-sm action-btn m-1" (click)="onDeleteRole(role.Id)">
            </button>
          </td>
        </tr>
      </ng-template>

      <!-- EMPTY STATE -->
      <ng-template pTemplate="emptymessage">
        <tr>
          <td colspan="3" class="empty-state">
            <div class="empty-box">
              <i class="pi pi-folder-open"></i>
              <p>No role records found</p>
            </div>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>

</div>
